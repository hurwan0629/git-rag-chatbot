<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git RAG · Search & Answer</title>
<style>
:root{color-scheme:dark;--bg:#10151e;--panel:#19212d;--line:#303e50;--text:#e8edf5;--muted:#9dadc2;--accent:#87c4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:25px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:12px 0 6px}p{margin:8px 0}small,.muted{color:var(--muted)}a{color:var(--accent);overflow-wrap:anywhere}button,input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px}button{cursor:pointer}button:hover,a:hover{color:#b8dcff}button:disabled{opacity:.5;cursor:default}textarea{resize:vertical;width:100%;min-height:120px}input[type=checkbox]{accent-color:var(--accent)}label{display:block}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;margin:24px 32px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.repo{border-bottom:1px solid var(--line);padding:12px 0}.repo label{overflow-wrap:anywhere}.metadata{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.error{color:#ffc2c2;white-space:pre-wrap}.badge{display:inline-block;font-size:12px;border-radius:4px;padding:2px 7px;background:#2b3c50;color:var(--accent);margin-right:8px}.actions{display:flex;align-items:center;gap:12px;margin:12px 0;flex-wrap:wrap}.actions input{width:65px}.source,.answer{white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;background:var(--bg);border-radius:8px;padding:16px}.source{font:13px/1.7 Consolas,monospace;max-height:420px;overflow:auto}.source mark{background:#244c70;color:inherit;border-bottom:2px solid var(--accent)}.answer{line-height:1.8}.results{margin-top:20px}.file{border-top:1px solid var(--line);padding:16px 0}.chunk{border-left:2px solid var(--line);margin-top:12px;padding-left:12px}.preview{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Consolas,monospace;max-height:150px;overflow:auto;margin:8px 0}details{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}summary{cursor:pointer}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;width:min(1100px,92vw);max-height:92vh;padding:24px}dialog::backdrop{background:#0009}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:20px}#document-title{overflow-wrap:anywhere}.status{min-height:26px}#top-k-label{display:flex;align-items:center;gap:8px}@media(max-width:850px){header{padding:18px}.layout{grid-template-columns:1fr;margin:18px}.panel{padding:16px}}
</style>
</head>
<body>
<header><h1>Git RAG · Search & Answer</h1><p class="muted">저장된 저장소에서 관련 파일·청크를 찾고 근거 답변을 확인합니다.</p><small id="session">서버 연결 중…</small></header>
<main class="layout">
<aside class="panel"><h2>검색할 저장소</h2><p class="metadata">저장소별 최신 완료 run을 사용합니다.</p><div id="repos"></div><details><summary>검색에서 제외된 run</summary><div id="skipped"></div></details></aside>
<section class="panel"><h2>질문</h2>
<form id="question-form"><label for="question" class="metadata">질문 본문 최대 500 E5 tokens · 서버에서 최종 길이를 검증합니다.</label><textarea id="question" placeholder="예: 데이터 생성과 모델 학습은 어떤 순서로 실행하나요?" required></textarea>
<div class="actions"><label id="top-k-label" for="top-k">Top K <input id="top-k" type="number" min="1" max="10" value="5" required></label><button id="search" type="submit">검색</button><button id="answer" type="button">답변 생성</button></div></form>
<div id="status" class="status" role="status" aria-live="polite"></div><div id="metrics" class="metadata"></div>
<section id="answer-panel" hidden><h2>답변</h2><p class="metadata">실험용 답변입니다. 주요 설명을 출처 청크와 대조하세요.</p><div id="answer-text" class="answer"></div><div id="answer-meta" class="metadata"></div><div id="citation-warning" class="error"></div></section>
<section class="results"><h2>관련 파일 / 청크</h2><p class="metadata">점수는 cosine similarity이며 확률이 아닙니다. Top K는 청크 수입니다.</p><div id="results"><p class="muted">저장소를 선택하고 질문을 입력하세요.</p></div></section>
</section>
</main>
<dialog id="document-dialog"><div class="modal-head"><h2 id="document-title">원문</h2><button id="close-document" type="button">닫기</button></div><div id="document-meta" class="metadata"></div><div id="document-link"></div><pre id="document-source" class="source"></pre><h3>선택 청크</h3><div id="chunk-meta" class="metadata"></div><pre id="chunk-source" class="source"></pre></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
let state = {sources:[], busy:false, mode:'search_only', documentRequest:0};
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function external(text,url){const a=node('a',text);try{const u=new URL(url);if(u.protocol==='https:'&&u.hostname==='github.com'){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';}}catch{}return a;}
function sourceHash(s){return '#'+new URLSearchParams({run:s.run_id,document:s.document_id,chunk:s.chunk_id}).toString();}
function sourceLink(text,s){const a=node('a',text);a.href=sourceHash(s);a.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'',a.href);openDocument(s);});return a;}
async function api(path,payload){const options=payload===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)};const response=await fetch(path,options);let body;try{body=await response.json();}catch{throw Error('서버 응답을 읽지 못했습니다. 서버 실행 상태를 확인하세요.');}if(!response.ok)throw Error(`${response.status} ${body.error?.code||''}: ${body.error?.message||'요청 실패'}`);return body;}
function renderRepos(data){
 state.mode=data.mode;$('session').textContent=`${data.mode==='rag'?'검색 + 답변 생성':'검색 전용'} · session ${data.session_id} · E5 small → Qwen3 4B`;
 $('repos').replaceChildren();
 for(const repo of data.repos){const row=node('div',undefined,'repo'),label=node('label'),check=node('input');check.type='checkbox';check.value=repo.repo;check.disabled=!repo.searchable;label.append(check,document.createTextNode(' '+repo.repo));row.append(label,node('div',`${repo.documents} files · ${repo.chunks} chunks`,'metadata'));if(repo.run_id)row.append(node('div','run: '+repo.run_id,'metadata'));if(repo.commit_sha)row.append(node('div','commit: '+repo.commit_sha.slice(0,12),'metadata'));if(repo.reason)row.append(node('div',repo.reason,'error'));$('repos').append(row);}
 $('skipped').replaceChildren();for(const run of data.skipped_runs)$('skipped').append(node('p',`${run.repo||'?'} / ${run.run_id}\n${run.reason}`,'metadata'));if(!data.skipped_runs.length)$('skipped').append(node('p','제외된 run 없음','muted'));
 $('answer').disabled=data.mode!=='rag';if(data.mode!=='rag')$('answer').title='일반 모드로 서버를 실행하면 답변을 생성할 수 있습니다.';
}
function renderResults(results){
 state.sources=results;$('results').replaceChildren();const groups=new Map();
 for(const s of results){const key=s.run_id+'/'+s.document_id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s);}
 for(const sources of groups.values()){const first=sources[0],file=node('article',undefined,'file');file.append(node('div',first.repo,'badge'),sourceLink(first.path,first),node('div',`commit ${first.commit_sha.slice(0,12)} · run ${first.run_id}`,'metadata'),external('GitHub 원본 ↗',first.source_url));
  for(const s of sources){const chunk=node('div',undefined,'chunk');chunk.append(sourceLink(`[${s.source_id}] L${s.start_line}–${s.end_line}`,s),node('span',' · score '+s.score.toFixed(4),'metadata'),node('div',`chunk ${s.chunk_id} · vector_row ${s.vector_row}`,'metadata'),node('pre',s.text,'preview'));file.append(chunk);}$('results').append(file);}
 if(!results.length)$('results').append(node('p','검색 결과가 없습니다.','muted'));
}
function renderAnswer(data){
 $('answer-panel').hidden=false;$('answer-text').replaceChildren();
 const allowed=new Set(data.context_source_ids),sources=new Map(data.results.map(s=>[s.source_id,s]));
 let cursor=0;for(const match of data.answer.matchAll(/\[(S\d+(?:\s*,\s*S\d+)*)\]/g)){$('answer-text').append(document.createTextNode(data.answer.slice(cursor,match.index)),document.createTextNode('['));const ids=match[1].split(',').map(id=>id.trim());ids.forEach((id,i)=>{if(i)$('answer-text').append(document.createTextNode(', '));const s=sources.get(id);$('answer-text').append(s&&allowed.has(id)?sourceLink(id,s):document.createTextNode(id));});$('answer-text').append(document.createTextNode(']'));cursor=match.index+match[0].length;}$('answer-text').append(document.createTextNode(data.answer.slice(cursor)));
 const g=data.generation;$('answer-meta').textContent=g?`${data.answer_status} · ${g.input_tokens} input / ${g.output_tokens} output tokens · 종료 ${g.finish_reason} · 근거 ${data.context_source_ids.join(', ')} · 모델 ${g.model_id} @ ${g.revision.slice(0,12)}`:data.answer_status;
 $('citation-warning').textContent=data.invalid_citation_ids.length?'유효하지 않은 인용: '+data.invalid_citation_ids.join(', '):'';
 if(g?.finish_reason==='length')$('citation-warning').textContent+='\n생성 길이 제한에 도달했습니다. 답변이 중간에 끝났을 수 있습니다.';
}
async function run(endpoint){
 if(state.busy)return;
 const repos=[...$('repos').querySelectorAll('input:checked')].map(e=>e.value),question=$('question').value.trim(),top_k=Number($('top-k').value);
 if(!repos.length||!question){$('status').textContent='저장소를 1개 이상 선택하고 질문을 입력하세요.';$('status').className='status error';return;}
 if(!Number.isInteger(top_k)||top_k<1||top_k>10){$('status').textContent='Top K는 1~10의 정수여야 합니다.';return;}
 state.busy=true;for(const id of ['search','answer','question','top-k'])$(id).disabled=true;
 const controls=[...$('repos').querySelectorAll('input')].filter(e=>!e.disabled);controls.forEach(e=>e.disabled=true);
 $('answer-panel').hidden=true;$('metrics').textContent='';$('results').replaceChildren();state.sources=[];
 const started=Date.now(),message=endpoint==='/api/answer'?'검색·답변 생성 중':'질문 인코딩·검색 중';$('status').className='status';
 const tick=()=>{$('status').textContent=`${message}… ${((Date.now()-started)/1000).toFixed(1)}초`;};tick();const timer=setInterval(tick,200);
 try{const data=await api(endpoint,{question,repos,top_k});renderResults(data.results);if(endpoint==='/api/answer')renderAnswer(data);$('status').textContent=`완료 · ${data.results.length} chunks · 질문 ${data.question_tokens} E5 tokens`;
 const t=data.timings_ms;$('metrics').textContent=`인코딩 ${t.query_encoding.toFixed(0)} ms · 검색 ${t.search.toFixed(0)} ms · 문맥 ${t.context.toFixed(0)} ms · 생성 ${t.generation.toFixed(0)} ms · 전체 ${t.total.toFixed(0)} ms`;
 }catch(error){$('status').textContent=error.message;$('status').className='status error';}
 finally{clearInterval(timer);state.busy=false;for(const id of ['search','question','top-k'])$(id).disabled=false;$('answer').disabled=state.mode!=='rag';controls.forEach(e=>e.disabled=false);}
}
async function openDocument(source){
 const request=++state.documentRequest,dialog=$('document-dialog');$('document-title').textContent=source.path;$('document-source').textContent='원문 조회 중…';$('document-meta').textContent='';$('document-link').replaceChildren();$('chunk-meta').textContent='';$('chunk-source').textContent='';if(!dialog.open)dialog.showModal();
 try{const doc=await api('/api/document?'+new URLSearchParams({run_id:source.run_id,document_id:source.document_id}));if(request!==state.documentRequest)return;
 $('document-meta').textContent=`${doc.repo} · commit ${doc.commit_sha} · document ${doc.document_id}`;$('document-link').append(external('GitHub 원본 ↗',doc.source_url));const chars=Array.from(doc.text);$('document-source').replaceChildren(document.createTextNode(chars.slice(0,source.start_offset).join('')),node('mark',chars.slice(source.start_offset,source.end_offset).join('')),document.createTextNode(chars.slice(source.end_offset).join('')));$('document-source').querySelector('mark')?.scrollIntoView({block:'center'});$('chunk-meta').textContent=`[${source.source_id}] L${source.start_line}–${source.end_line} · 문자 [${source.start_offset}, ${source.end_offset}) · vector_row ${source.vector_row}`;$('chunk-source').textContent=source.text;
 }catch(error){if(request===state.documentRequest)$('document-source').textContent=error.message;}
}
$('question-form').addEventListener('submit',e=>{e.preventDefault();run('/api/search');});$('answer').addEventListener('click',()=>run('/api/answer'));$('close-document').addEventListener('click',()=>{$('document-dialog').close();state.documentRequest++;});
api('/api/repos').then(renderRepos).catch(error=>{$('status').textContent=error.message;$('status').className='status error';$('search').disabled=true;$('answer').disabled=true;});
</script>
</body>
</html>
